[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tomet-shelf-assets = { path = "crates/tomet-shelf-assets" }
tomet-shelf-icons = { path = "crates/tomet-shelf-icons" }
tomet-shelf-render = { path = "crates/tomet-shelf-render" }
#--- Headless ---
tomet-shelf-headless = { path = "crates/tomet-shelf-headless" }
tomet-shelf-config = { path = "crates/tomet-shelf-headless-config" }
tomet-shelf-document = { path = "crates/tomet-shelf-headless-document" }
tomet-shelf-incremental = { path = "crates/tomet-shelf-headless-incremental" }
tomet-shelf-route = { path = "crates/tomet-shelf-headless-route" }
tomet-shelf-search = { path = "crates/tomet-shelf-headless-search" }
tomet-shelf-serve = { path = "crates/tomet-shelf-headless-serve" }

#= Tomet
tomet = { git = "https://github.com/tomet-lang/tomet.git", features = [
  "deps",
  "html",
  "links",
  "parser",
] }

#= Crates.io
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
askama = "0.16"
notify = "6.1"
pagefind = { version = "1.5", default-features = false }
percent-encoding = "2.3"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.42", features = ["full"] }
toml = "0.8"
tower-http = "0.5.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.12"
walkdir = "2.5"

[profile.dev.package."*"]
opt-level = 3
