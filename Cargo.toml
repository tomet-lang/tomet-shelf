[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tomet-shelf = { path = "crates/tomet-shelf" }
tomet-shelf-config = { path = "crates/tomet-shelf-config" }
tomet-shelf-assets = { path = "crates/tomet-shelf-assets" }
tomet-shelf-render = { path = "crates/tomet-shelf-render" }
tomet-shelf-search = { path = "crates/tomet-shelf-search" }
tomet-shelf-serve = { path = "crates/tomet-shelf-serve" }

#= Tomet
tomet-ast = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-compute = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-html = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-indexer = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-links = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-parser = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-semantics = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-transform = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-tree = { git = "https://github.com/tomet-lang/tomet.git" }

#= Crates.io
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
minijinja = { version = "2.7", features = ["json", "loader"] }
notify = "6.1"
pagefind = { version = "1.5", default-features = false }
percent-encoding = "2.3"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.42", features = ["full"] }
toml = "0.8"
tower-http = "0.5.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.12"
walkdir = "2.5"

[profile.dev.package."*"]
opt-level = 3
