[package]
name = "tomet-shelf-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for tomet-shelf - A standalone book & wiki generator for Tomet"

[[bin]]
name = "tomet-shelf"
path = "src/main.rs"

[dependencies]
tomet-shelf-core = { workspace = true }
tomet-shelf-assets = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
embedded-search = ["tomet-shelf-core/embedded-search"]
embedded-search-extended = ["tomet-shelf-core/embedded-search-extended"]
